name: Deploy no GitHub Pages

# Todo push na main publica o guia no GitHub Pages, em três etapas:
#   1. valida o build (nada vai ao ar com referência quebrada);
#   2. publica a versão do commit no Pages;
#   3. confere o site no ar: arquivos idênticos ao commit e guia renderizando.
# Em PRs para a main roda só a validação. Também dá para disparar à mão
# (Actions → Deploy no GitHub Pages → Run workflow) para republicar a main.
#
# Requer Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez, sem cancelar o que está em andamento: assim a
# verificação de um push nunca cruza com o deploy do push seguinte.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('validar-{0}', github.ref) || 'github-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validar:
    name: Validar o build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Montar e validar o site
        run: .github/scripts/montar-site.sh "$RUNNER_TEMP/site"

      - name: Empacotar o site para o Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
          retention-days: 1

  publicar:
    name: Publicar no GitHub Pages
    needs: validar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Conferir a fonte do Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fonte="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)"
          if [[ "$fonte" != "workflow" ]]; then
            echo "::error::O Pages ainda publica a partir de uma branch (build_type=$fonte). Em Settings → Pages → Build and deployment, troque Source para \"GitHub Actions\" e rode este workflow de novo."
            exit 1
          fi

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v5

  verificar:
    name: Verificar o site no ar
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Montar o site de referência
        run: .github/scripts/montar-site.sh "$RUNNER_TEMP/site"

      - name: Conferir arquivos e renderização
        env:
          URL_DO_SITE: ${{ needs.publicar.outputs.page_url }}
        run: .github/scripts/verificar-deploy.sh "$URL_DO_SITE" "$RUNNER_TEMP/site"
