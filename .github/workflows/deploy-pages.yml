name: Deploy no GitHub Pages

# Todo push na main publica o guia no GitHub Pages, em três etapas:
#   1. valida o build e busca a lista de presentes na página da Afubra
#      (nada vai ao ar com referência quebrada ou lista ilegível);
#   2. publica o site no Pages;
#   3. confere o site no ar: arquivos idênticos ao publicado e guia renderizando.
# A cada 15 minutos o workflow relê a lista da Afubra e republica o site só
# se algum presente mudou (comprado, incluído, removido, preço).
# Em PRs para a main roda só a validação. Também dá para disparar à mão
# (Actions → Deploy no GitHub Pages → Run workflow) para republicar a main.
#
# Requer Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

env:
  URL_DO_SITE: https://luis-b-o.github.io/irati-wedding-guide/

# Na main, um deploy por vez e sem cancelar o que está em andamento: assim a
# verificação de um push nunca cruza com o deploy do push seguinte.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'github-pages' || format('validar-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validar:
    name: Validar o build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artefato: ${{ steps.nome.outputs.artefato }}
      publicar: ${{ steps.presentes.outputs.publicar }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Testar o leitor da lista de presentes
        run: node --test .github/scripts/atualizar-presentes.test.mjs

      # O feed no ar serve para reconhecer presentes já comprados (a loja tira
      # o link deles) e, nas execuções agendadas, para saber se algo mudou.
      # Se a Afubra não responder num push, o deploy segue com a lista que já
      # está no ar; em PRs e execuções agendadas, a falha fica visível.
      - name: Buscar a lista de presentes na Afubra
        id: presentes
        run: |
          no_ar="$RUNNER_TEMP/feed-no-ar.json"
          if ! curl -fsS --retry 2 --max-time 30 -o "$no_ar" "${URL_DO_SITE}gift-feed.json?v=$GITHUB_RUN_ID"; then
            echo "::warning::Não deu para baixar o gift-feed.json publicado; a referência é o do repositório."
            cp gift-feed.json "$no_ar"
          fi
          if ! node .github/scripts/atualizar-presentes.mjs --anterior "$no_ar" --saida gift-feed.json; then
            if [[ "$GITHUB_EVENT_NAME" != push && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
              exit 1
            fi
            echo "::warning::A lista da Afubra não pôde ser lida; o deploy segue com a lista que já está no ar."
            cp "$no_ar" gift-feed.json
          fi
          if [[ "$GITHUB_EVENT_NAME" == schedule ]] &&
            cmp -s <(jq -S 'del(.scrapedAt)' "$no_ar") <(jq -S 'del(.scrapedAt)' gift-feed.json); then
            echo "Nenhum presente mudou desde o último deploy; nada a publicar."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi
          jq -r '[.items[] | select(.status == "fully-purchased") | .name] as $ganhos
            | "Lista de presentes: \(.itemCount) presentes, \($ganhos | length) já ganho(s) — lida em \(.scrapedAt).",
              ($ganhos[] | "- Já ganhamos: \(.)")' gift-feed.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Montar e validar o site
        run: .github/scripts/montar-site.sh "$RUNNER_TEMP/site"

      # Um nome por tentativa: num "Re-run all jobs" o deploy-pages acharia
      # dois artefatos "github-pages" no mesmo run e recusaria publicar.
      - name: Nomear o artefato desta tentativa
        id: nome
        if: steps.presentes.outputs.publicar == 'true'
        run: echo "artefato=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Empacotar o site para o Pages
        if: steps.presentes.outputs.publicar == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.nome.outputs.artefato }}
          path: ${{ runner.temp }}/site
          retention-days: 1

  publicar:
    name: Publicar no GitHub Pages
    needs: validar
    if: github.ref == 'refs/heads/main' && needs.validar.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Conferir a fonte do Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fonte="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)"
          if [[ "$fonte" != "workflow" ]]; then
            echo "::error::O Pages ainda publica a partir de uma branch (build_type=$fonte). Em Settings → Pages → Build and deployment, troque Source para \"GitHub Actions\" e depois dispare Actions → Deploy no GitHub Pages → Run workflow (branch main)."
            exit 1
          fi

      # Re-executar um run antigo não pode trocar o site no ar por uma versão
      # velha: só publica se este commit ainda for o topo da main.
      - name: Conferir se o commit ainda é o topo da main
        id: atual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          topo="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$topo" == "$GITHUB_SHA" ]]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deploy pulado: este run é do commit ${GITHUB_SHA::7}, mas a main já está em ${topo::7}, que tem o próprio deploy."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar
        id: deploy
        if: steps.atual.outputs.publicar == 'true'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.validar.outputs.artefato }}

  verificar:
    name: Verificar o site no ar
    needs: [validar, publicar]
    if: needs.publicar.outputs.page_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # A referência é o pacote que foi ao ar (com a lista lida da Afubra),
      # não o repositório.
      - name: Baixar o pacote publicado
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.validar.outputs.artefato }}
          path: ${{ runner.temp }}/pacote

      - name: Extrair o site publicado
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar -xf "$RUNNER_TEMP/pacote/artifact.tar" -C "$RUNNER_TEMP/site"

      - name: Conferir arquivos e renderização
        env:
          URL_PUBLICADA: ${{ needs.publicar.outputs.page_url }}
        run: .github/scripts/verificar-deploy.sh "$URL_PUBLICADA" "$RUNNER_TEMP/site"
