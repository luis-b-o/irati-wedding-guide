name: Deploy no GitHub Pages

# Todo push na main publica o guia no GitHub Pages, em três etapas:
#   1. valida o build e busca a lista de presentes na página da Afubra
#      (nada vai ao ar com referência quebrada ou lista ilegível);
#   2. publica o site no Pages;
#   3. confere o site no ar: arquivos idênticos ao publicado e guia renderizando.
# De 12 em 12 horas, até 27/10, o workflow relê a lista da Afubra e
# republica o site só se algum presente mudou (comprado, incluído, removido,
# preço). Depois de 27/10 a lista não é mais lida: fica a que estiver no ar.
# Presente ganho ou incluído na lista vira uma issue mencionando o dono do
# repositório, e o GitHub manda o aviso por e-mail.
# Em PRs para a main roda só a validação. Também dá para disparar à mão
# (Actions → Deploy no GitHub Pages → Run workflow) para republicar a main
# ou, marcando "testar_aviso", para receber um e-mail de teste.
#
# Requer Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      testar_aviso:
        description: Enviar também um aviso de teste por e-mail
        type: boolean
        default: false
  schedule:
    # 08:17 e 20:17 em Brasília (11:17 e 23:17 UTC), de 1º a 27 de outubro.
    - cron: '17 11,23 1-27 10 *'

permissions:
  contents: read

env:
  URL_DO_SITE: https://luis-b-o.github.io/irati-wedding-guide/
  # Último dia em que a lista é lida da Afubra (horário de Brasília).
  FIM_DA_ATUALIZACAO: '2026-10-27'

# Na main, um deploy por vez e sem cancelar o que está em andamento: assim a
# verificação de um push nunca cruza com o deploy do push seguinte.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'github-pages' || format('validar-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validar:
    name: Validar o build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artefato: ${{ steps.nome.outputs.artefato }}
      publicar: ${{ steps.presentes.outputs.publicar }}
      novidades: ${{ steps.presentes.outputs.novidades }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Testar o leitor da lista de presentes
        run: node --test .github/scripts/atualizar-presentes.test.mjs

      # O feed no ar serve para reconhecer presentes já comprados (a loja tira
      # o link deles), para saber se algo mudou e para listar as novidades do
      # aviso por e-mail. Se a Afubra não responder num push, o deploy segue
      # com a lista que já está no ar (nunca com a do repositório, que é
      # antiga); em PRs e execuções agendadas, a falha fica visível.
      - name: Buscar a lista de presentes na Afubra
        id: presentes
        env:
          TESTAR_AVISO: ${{ inputs.testar_aviso }}
        run: |
          no_ar="$RUNNER_TEMP/feed-no-ar.json"
          tem_feed_no_ar=true
          mkdir -p "$RUNNER_TEMP/diagnostico"
          if ! curl -fsS --retry 2 --max-time 30 -o "$no_ar" "${URL_DO_SITE}gift-feed.json?v=$GITHUB_RUN_ID"; then
            echo "::warning::Não deu para baixar o gift-feed.json publicado; a referência é o do repositório."
            cp gift-feed.json "$no_ar"
            tem_feed_no_ar=false
          fi
          if [[ "$(TZ=America/Sao_Paulo date +%F)" > "$FIM_DA_ATUALIZACAO" ]]; then
            # Atualização encerrada: o agendado não faz nada e um push publica
            # a lista que já está no ar.
            if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
              echo "A lista não é mais lida da Afubra depois de $FIM_DA_ATUALIZACAO; nada a fazer."
              echo "publicar=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$tem_feed_no_ar" != true ]]; then
              echo "::error::O gift-feed.json publicado não respondeu; nada foi publicado para não voltar a uma lista antiga."
              exit 1
            fi
            echo "A lista não é mais lida da Afubra depois de $FIM_DA_ATUALIZACAO; segue a que está no ar."
            cp "$no_ar" gift-feed.json
          elif ! node .github/scripts/atualizar-presentes.mjs --anterior "$no_ar" --saida gift-feed.json \
            --diagnostico "$RUNNER_TEMP/diagnostico/pagina-da-afubra.html"; then
            if [[ "$GITHUB_EVENT_NAME" != push && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
              exit 1
            fi
            if [[ "$tem_feed_no_ar" != true ]]; then
              echo "::error::Nem a Afubra nem o gift-feed.json publicado responderam; nada foi publicado para não voltar a uma lista antiga."
              exit 1
            fi
            echo "::warning::A lista da Afubra não pôde ser lida; o deploy segue com a lista que já está no ar."
            cp "$no_ar" gift-feed.json
          fi
          # Agendado: só republica se a lista mudou ou se o site no ar não é
          # deste commit (um push que esperava na fila pode ter sido substituído
          # por esta execução). O index.html cita os bundles pelo hash, então
          # muda sempre que o build muda.
          if [[ "$GITHUB_EVENT_NAME" == schedule ]] &&
            cmp -s <(jq -S 'del(.scrapedAt)' "$no_ar") <(jq -S 'del(.scrapedAt)' gift-feed.json) &&
            curl -fsS --retry 2 --max-time 30 "${URL_DO_SITE}?v=$GITHUB_RUN_ID" | cmp -s - index.html; then
            echo "Nenhum presente mudou e o site no ar já é deste commit; nada a publicar."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi
          # Novidades para o aviso por e-mail: presente ganho desde o último
          # deploy e presente que entrou na lista. Só contra o feed no ar: o
          # do repositório é antigo e repetiria avisos já dados.
          novidades=""
          if [[ "$tem_feed_no_ar" == true ]]; then
            novidades="$(jq -r --slurpfile antes "$no_ar" '
              ($antes[0].items | map({key: .id, value: .}) | from_entries) as $a
              | .items[] | $a[.id] as $p
              | if $p == null then "- Entrou na lista: \(.name) (R$ \(.priceBRL))"
                elif .purchased > $p.purchased then "- Ganhamos: \(.name) (\(.purchased) de \(.requested))"
                else empty end' gift-feed.json)"
          fi
          if [[ "$TESTAR_AVISO" == true ]]; then
            novidades+="${novidades:+$'\n'}- Teste: este é um aviso de teste, nenhum presente mudou."
          fi
          {
            echo "novidades<<FIM_DAS_NOVIDADES"
            if [[ -n "$novidades" ]]; then echo "$novidades"; fi
            echo "FIM_DAS_NOVIDADES"
          } >> "$GITHUB_OUTPUT"
          if [[ -n "$novidades" ]]; then echo "$novidades" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          jq -r '[.items[] | select(.status == "fully-purchased") | .name] as $ganhos
            | "Lista de presentes: \(.itemCount) presentes, \($ganhos | length) já ganho(s) — lida em \(.scrapedAt).",
              ($ganhos[] | "- Já ganhamos: \(.)")' gift-feed.json | tee -a "$GITHUB_STEP_SUMMARY"

      # Quando a Afubra devolve outra coisa no lugar da lista, a página fica
      # guardada para ver o que a loja mostrou.
      - name: Guardar a página da Afubra que não pôde ser lida
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pagina-da-afubra-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnostico/
          if-no-files-found: ignore
          retention-days: 7

      - name: Montar e validar o site
        run: .github/scripts/montar-site.sh "$RUNNER_TEMP/site"

      # Um nome por tentativa: num "Re-run all jobs" o deploy-pages acharia
      # dois artefatos "github-pages" no mesmo run e recusaria publicar.
      - name: Nomear o artefato desta tentativa
        id: nome
        if: steps.presentes.outputs.publicar == 'true'
        run: echo "artefato=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Empacotar o site para o Pages
        if: steps.presentes.outputs.publicar == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.nome.outputs.artefato }}
          path: ${{ runner.temp }}/site
          retention-days: 1

  publicar:
    name: Publicar no GitHub Pages
    needs: validar
    if: github.ref == 'refs/heads/main' && needs.validar.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Conferir a fonte do Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fonte="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)"
          if [[ "$fonte" != "workflow" ]]; then
            echo "::error::O Pages ainda publica a partir de uma branch (build_type=$fonte). Em Settings → Pages → Build and deployment, troque Source para \"GitHub Actions\" e depois dispare Actions → Deploy no GitHub Pages → Run workflow (branch main)."
            exit 1
          fi

      # Re-executar um run antigo não pode trocar o site no ar por uma versão
      # velha: só publica se este commit ainda for o topo da main.
      - name: Conferir se o commit ainda é o topo da main
        id: atual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          topo="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$topo" == "$GITHUB_SHA" ]]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deploy pulado: este run é do commit ${GITHUB_SHA::7}, mas a main já está em ${topo::7}, que tem o próprio deploy."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar
        id: deploy
        if: steps.atual.outputs.publicar == 'true'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.validar.outputs.artefato }}

  verificar:
    name: Verificar o site no ar
    needs: [validar, publicar]
    if: needs.publicar.outputs.page_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # A referência é o pacote que foi ao ar (com a lista lida da Afubra),
      # não o repositório.
      - name: Baixar o pacote publicado
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.validar.outputs.artefato }}
          path: ${{ runner.temp }}/pacote

      - name: Extrair o site publicado
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar -xf "$RUNNER_TEMP/pacote/artifact.tar" -C "$RUNNER_TEMP/site"

      - name: Conferir arquivos e renderização
        env:
          URL_PUBLICADA: ${{ needs.publicar.outputs.page_url }}
        run: .github/scripts/verificar-deploy.sh "$URL_PUBLICADA" "$RUNNER_TEMP/site"

  # O GitHub manda por e-mail as menções em issues: o aviso é uma issue que
  # menciona o dono do repositório. Só depois do deploy, para que a próxima
  # execução já compare com a lista nova e não repita o aviso.
  avisar:
    name: Avisar por e-mail
    needs: [validar, publicar]
    if: needs.publicar.outputs.page_url != '' && needs.validar.outputs.novidades != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Abrir a issue do aviso
        env:
          GH_TOKEN: ${{ github.token }}
          NOVIDADES: ${{ needs.validar.outputs.novidades }}
          DONO: ${{ github.repository_owner }}
        run: |
          quando="$(TZ=America/Sao_Paulo date '+%d/%m às %H:%M')"
          corpo="$(printf '@%s, a lista de presentes na Lojas Afubra mudou:\n\n%s\n\nO guia já foi atualizado: %s\n\nExecução: %s/%s/actions/runs/%s' \
            "$DONO" "$NOVIDADES" "$URL_DO_SITE" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "🎁 Lista de presentes: novidades em $quando" --body "$corpo"
