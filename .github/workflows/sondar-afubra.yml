name: Sondagem temporária da página de impressão da Afubra

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Comparar a página de impressão com a página da lista
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --blink-settings=imagesEnabled=false \
            --virtual-time-budget=10000 --dump-dom 'https://www.listapresentes.lojasafubra.com.br/sys/imprime.php?lista=2391' > "$RUNNER_TEMP/imprime.html" 2>/dev/null
          node .github/scripts/atualizar-presentes.mjs --anterior gift-feed.json --saida "$RUNNER_TEMP/lista.json"
          python3 - "$RUNNER_TEMP/imprime.html" "$RUNNER_TEMP/lista.json" <<'PY'
          import re, sys, html, json, unicodedata
          def chave(n):
              n = re.sub(r'\*\S*$', '', n).replace('*', ' ')
              n = re.sub(r'\s*-\s*\d+$', '', n)
              n = re.sub(r'\s+,', ',', re.sub(r'\s+', ' ', n)).strip()
              n = ''.join(c for c in unicodedata.normalize('NFD', n) if unicodedata.category(c) != 'Mn')
              return n.upper()
          s = open(sys.argv[1], encoding='utf-8').read()
          imp = []
          for r in re.findall(r'<tr[^>]*>(.*?)</tr>', s, re.S):
              tds = re.findall(r'<td[^>]*>(.*?)</td>', r, re.S)
              if len(tds) != 3: continue
              nome = html.unescape(tds[0].split('<br>')[0]).strip()
              preco = re.search(r'R\$\s*([\d.,]+)', tds[0]).group(1)
              imp.append((nome, preco, int(tds[1]), int(tds[2])))
          lista = json.load(open(sys.argv[2]))['items']
          porchave = {chave(i['name']): i for i in lista}
          print(f'impressão: {len(imp)} | lista: {len(lista)}')
          print('comprados na impressão:', [(n, d, c) for n, p, d, c in imp if c > 0])
          vistos = set()
          for n, p, d, c in imp:
              i = porchave.get(chave(n))
              if not i:
                  print(f'SÓ NA IMPRESSÃO: {n} | R$ {p} | desejada {d} | comprada {c}')
                  continue
              vistos.add(i['id'])
              if (i['priceBRL'], i['requested'], i['purchased']) != (p, d, c):
                  print(f'DIFERENTE: {n}: impressão R$ {p} {d}/{c} x lista R$ {i["priceBRL"]} {i["requested"]}/{i["purchased"]}')
          for i in lista:
              if i['id'] not in vistos: print(f'SÓ NA LISTA: {i["name"]} | {i["status"]}')
          PY
